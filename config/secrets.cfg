# secrets.cfg
# WARNING: This file demonstrates storing secrets in config files.
# Credentials should NEVER be stored in source code or config files.
# Use environment variables or a secrets manager instead.

# Database Password
# Risk: Anyone with code access can connect directly to production database
db_password=Pr0d@dmin#2024!

# Internal API Key
# Risk: Exposed API key allows unauthorised access to internal services
internal_api_key=api-key-1234567890abcdef1234567890abcdef

# Mailgun API Key
# Risk: Exposed key allows attackers to send emails on your behalf
mailgun_api_key=key-1234567890abcdef1234567890abcdef

# Twilio Auth Token
# Risk: Exposed token allows attackers to send SMS on your behalf
twilio_auth_token=SK1234567890abcdef1234567890abcdef

# Slack Webhook URL
# Risk: Exposed webhook allows attackers to post messages to your Slack
slack_webhook=https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX